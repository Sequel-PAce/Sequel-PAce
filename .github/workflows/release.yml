name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Publish Release
    runs-on: macos-15
    steps:
    - name: Checkout the Git repository
      uses: actions/checkout@v4

    - name: Install PostgreSQL
      run: |
        brew install postgresql@17
        brew link postgresql@17 --force

    - name: Import Developer ID certificate
      env:
        CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
        CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      run: |
        test -n "$CERTIFICATE_BASE64"
        test -n "$CERTIFICATE_PASSWORD"
        test -n "$KEYCHAIN_PASSWORD"
        KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
        echo "$CERTIFICATE_BASE64" | base64 -D > "$RUNNER_TEMP/developer-id.p12"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security import "$RUNNER_TEMP/developer-id.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
        security list-keychain -d user -s "$KEYCHAIN_PATH"
        security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

    - name: Package and notarize DMG
      run: ./Scripts/build.sh package
      env:
        NOTARIZATION_APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
        NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
        NOTARIZATION_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: "build/Sequel PAce.dmg"
        generate_release_notes: true
        draft: false
        prerelease: false
